version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "7071:7071"
    environment:
      - DATABASE_URL=postgresql://morpho:morpho@db:5432/morphopack
      - BLENDER_PATH=/usr/bin/blender
      - PORT=7071
    volumes:
      - ./MorphoPackEngine/uploads:/app/MorphoPackEngine/uploads
      - ./MorphoPackEngine/outputs:/app/MorphoPackEngine/outputs
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_BASE=http://localhost:7071/api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: morpho
      POSTGRES_PASSWORD: morpho
      POSTGRES_DB: morphopack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morpho"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
